<section class="registros-lista">
  <h2>Registros</h2>
  <div class="acciones">
    <button (click)="irNuevo()">Nuevo Registro</button>
    <button *ngIf="isAdmin" (click)="verTodosAdmin()">Ver todos (admin)</button>
    <input type="text" placeholder="Buscar tipo" [(ngModel)]="filtroTipo"/>
    <select [(ngModel)]="filtroEstado">
      <option value="">Todos</option>
      <option value="PENDIENTE">Pendiente</option>
      <option value="PAGADO">Pagado</option>
      <option value="VENCIDO">Vencido</option>
    </select>
  </div>
  <div class="resumen-estado" *ngIf="registrosFiltrados.length > 0">
    <span>Pendientes: {{ countPendiente }}</span>
    <span>Pagados: {{ countPagado }}</span>
    <span>Vencidos: {{ countVencido }}</span>
  </div>
  <table *ngIf="registrosFiltrados.length > 0">
    <thead>
      <tr>
        <th>ID</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Estado</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of registrosFiltrados">
        <td>{{ r.id }}</td>
        <td>{{ r.tipoImpuesto }}</td>
        <td>{{ r.monto | number:'1.2-2' }}</td>
        <td>{{ r.fechaVencimiento }}</td>
        <td>{{ r.estado }}</td>
        <td>
          <button (click)="verDetalle(r.id!)">Detalle</button>
          <button (click)="editar(r.id!)">Editar</button>
          <button (click)="eliminar(r.id!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="registrosFiltrados.length === 0">Sin registros.</p>
</section>
