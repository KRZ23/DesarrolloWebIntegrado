
    <div class="relative flex size-full min-h-screen flex-col dark group/design-root overflow-x-hidden"
        style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e'); --select-button-svg: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(146,173,201)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e'); font-family: Inter, &quot;Noto Sans&quot;, sans-serif;">
        <div class="layout-container flex h-full grow flex-col">

            <main class="flex-1 px-4 py-10 sm:px-6 lg:px-8">
                <div class="mx-auto w-full max-w-lg">
                    <div class="text-center">
                        <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Crea tu Cuenta</h1>
                        <p class="mt-4 text-slate-400">Comienza a gestionar tus tributos de forma sencilla.</p>
                    </div>
                    <form class="mt-8 space-y-6">
                        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
                            <div class="sm:col-span-2">
                                <label class="block text-sm font-medium text-slate-300" for="full-name">Nombre
                                    Completo</label>
                                <div class="mt-1">
                                    <input autocomplete="name"
                                        class="form-input block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="full-name" name="full-name" placeholder="Ingresa tu nombre completo"
                                        required="" type="text" />
                                </div>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-sm font-medium text-slate-300" for="ruc">RUC</label>
                                <div class="mt-1">
                                    <input autocomplete=""
                                        class="form-input block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="ruc" name="ruc" placeholder="0000000000" required="" type="number" />
                                </div>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-sm font-medium text-slate-300" for="email">Correo
                                    Electrónico</label>
                                <div class="mt-1">
                                    <input autocomplete="email"
                                        class="form-input block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="email" name="email" placeholder="tu@ejemplo.com" required="" type="email" />
                                </div>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-sm font-medium text-slate-300" for="phone-number">Número de
                                    Teléfono</label>
                                <div class="mt-1">
                                    <input autocomplete="tel"
                                        class="form-input block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="phone-number" name="phone-number"
                                        placeholder="Ingresa tu número de teléfono" type="tel" />
                                </div>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-sm font-medium text-slate-300" for="account-type">Tipo de
                                    Cuenta</label>
                                <div class="mt-1">
                                    <select
                                        class="form-select block w-full rounded-md border-slate-700 bg-slate-800 text-white focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="account-type" name="account-type">
                                        <option>Selecciona un tipo</option>
                                        <option>Persona Natural</option>
                                        <option>Persona Jurídica</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300"
                                    for="password">Contraseña</label>
                                <div class="mt-1">
                                    <input autocomplete="new-password"
                                        class="form-input block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="password" name="password" placeholder="Crea una contraseña" required=""
                                        type="password" />
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300" for="confirm-password">Confirmar
                                    Contraseña</label>
                                <div class="mt-1">
                                    <input autocomplete="new-password"
                                        class="form-input block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:border-[#1173d4] focus:ring-[#1173d4] sm:text-sm"
                                        id="confirm-password" name="confirm-password"
                                        placeholder="Confirma tu contraseña" required="" type="password" />
                                </div>
                            </div>
                        </div>
                        <div class="flex items-start">
                            <div class="flex h-5 items-center">
                                <input
                                    class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-[#1173d4] focus:ring-[#1173d4]"
                                    id="terms" name="terms" required="" type="checkbox" />
                            </div>
                            <div class="ml-3 text-sm">
                                <label class="font-medium text-slate-300" for="terms">Acepto los <a
                                        class="text-[#1173d4] hover:underline" href="#">Términos de Servicio</a> y la <a
                                        class="text-[#1173d4] hover:underline" href="#">Política de
                                        Privacidad</a></label>
                            </div>
                        </div>
                        <div>
                            <button
                                class="flex w-full justify-center rounded-md border border-transparent bg-[#1173d4] py-3 px-4 text-base font-bold text-white shadow-sm hover:bg-[#0f63b6] focus:outline-none focus:ring-2 focus:ring-[#1173d4] focus:ring-offset-2 focus:ring-offset-slate-900"
                                type="submit">
                                Registrarse
                            </button>
                        </div>
                    </form>
                    <p class="mt-6 text-center text-sm text-slate-400">
                        ¿Ya tienes una cuenta?
                        <a class="font-medium text-[#1173d4] hover:underline" routerLink="/iniciar-sesion">Inicia Sesión</a>
                    </p>
                </div>
            </main>
        </div>
    </div>
