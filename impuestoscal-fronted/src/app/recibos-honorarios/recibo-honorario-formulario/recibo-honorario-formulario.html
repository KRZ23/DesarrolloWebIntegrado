<div class="max-w-xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-4">{{ editId ? 'Editar Recibo' : 'Nuevo Recibo' }}</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Número de recibo</label>
      <input formControlName="numeroRecibo" class="w-full p-2 rounded bg-[var(--card-background-color)] text-[var(--text-primary)]" />
      <small *ngIf="form.get('numeroRecibo')?.touched && form.get('numeroRecibo')?.errors?.['required']" class="text-red-400">Requerido</small>
      <small *ngIf="form.get('numeroRecibo')?.touched && form.get('numeroRecibo')?.errors?.['pattern']" class="text-red-400">Alfanumérico 3-20</small>
    </div>
    <div>
      <label class="block text-sm mb-1">Fecha emisión</label>
      <input type="date" formControlName="fechaEmision" class="w-full p-2 rounded bg-[var(--card-background-color)] text-[var(--text-primary)]" />
      <small *ngIf="form.get('fechaEmision')?.touched && form.get('fechaEmision')?.invalid" class="text-red-400">Requerida</small>
    </div>
    <div>
      <label class="block text-sm mb-1">Monto total</label>
      <input type="number" step="0.01" formControlName="montoTotal" class="w-full p-2 rounded bg-[var(--card-background-color)] text-[var(--text-primary)]" />
      <small *ngIf="form.get('montoTotal')?.touched && form.get('montoTotal')?.errors?.['min']" class="text-red-400">Debe ser > 0</small>
      <small *ngIf="form.get('montoTotal')?.touched && form.get('montoTotal')?.errors?.['required']" class="text-red-400">Requerido</small>
    </div>
    <div>
      <label class="block text-sm mb-1">Descripción servicio</label>
      <textarea formControlName="descripcionServicio" class="w-full p-2 rounded bg-[var(--card-background-color)] text-[var(--text-primary)]"></textarea>
      <small *ngIf="form.get('descripcionServicio')?.touched && form.get('descripcionServicio')?.errors?.['maxlength']" class="text-red-400">Máximo 250 caracteres</small>
    </div>
    <div>
      <label class="block text-sm mb-1">Cliente (Razón social)</label>
      <input formControlName="clienteRazonSocial" class="w-full p-2 rounded bg-[var(--card-background-color)] text-[var(--text-primary)]" />
      <small *ngIf="form.get('clienteRazonSocial')?.touched && form.get('clienteRazonSocial')?.errors?.['required']" class="text-red-400">Requerido</small>
      <small *ngIf="form.get('clienteRazonSocial')?.touched && form.get('clienteRazonSocial')?.errors?.['minlength']" class="text-red-400">Mínimo 2</small>
      <small *ngIf="form.get('clienteRazonSocial')?.touched && form.get('clienteRazonSocial')?.errors?.['maxlength']" class="text-red-400">Máximo 120</small>
    </div>
    <div>
      <label class="block text-sm mb-1">Cliente RUC</label>
      <input formControlName="clienteRuc" class="w-full p-2 rounded bg-[var(--card-background-color)] text-[var(--text-primary)]" />
      <small *ngIf="form.get('clienteRuc')?.touched && form.get('clienteRuc')?.errors?.['pattern']" class="text-red-400">RUC 11 dígitos</small>
    </div>

    <div class="flex justify-end gap-2 mt-6">
      <button type="button" (click)="cancelar()" class="px-4 py-2 bg-gray-500 text-white rounded">Cancelar</button>
      <button type="submit" [disabled]="saving || form.invalid" class="px-4 py-2 bg-[var(--primary-color)] text-white rounded disabled:opacity-50">
        <span *ngIf="!saving">{{ editId ? 'Actualizar' : 'Crear' }}</span>
        <span *ngIf="saving">Guardando...</span>
      </button>
    </div>
  </form>
  <p *ngIf="error" class="mt-4 text-sm text-red-400">{{ error }}</p>
</div>
